<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Propinas 💵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1>💵 Calculadora de Propinas</h1>
    <p class="subtitulo">Dividí la cuenta entre amigos sin errores de cálculo</p>

    <label for="monto">Monto de la cuenta</label>
    <input type="number" id="monto" min="0" step="0.01" placeholder="0.00" inputmode="decimal">

    <label for="propina">Propina (%)</label>
    <div class="botones-porcentaje" id="botones-porcentaje">
      <button data-porcentaje="0">0%</button>
      <button data-porcentaje="10">10%</button>
      <button data-porcentaje="15" class="activo">15%</button>
      <button data-porcentaje="20">20%</button>
      <button data-porcentaje="25">25%</button>
    </div>
    <input type="number" id="propina-custom" min="0" max="100" step="1" placeholder="Otro %">

    <label for="personas">Dividir entre</label>
    <div class="selector-personas">
      <button id="btn-menos">−</button>
      <input type="number" id="personas" min="1" value="1" inputmode="numeric">
      <button id="btn-mas">+</button>
    </div>

    <div class="resultado">
      <div class="linea">
        <span>Propina total</span>
        <strong id="resultado-propina">Bs. 0.00</strong>
      </div>
      <div class="linea">
        <span>Total con propina</span>
        <strong id="resultado-total">Bs. 0.00</strong>
      </div>
      <div class="linea destacada">
        <span>Por persona</span>
        <strong id="resultado-por-persona">Bs. 0.00</strong>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
